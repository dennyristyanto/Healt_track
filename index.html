<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Denny Ristyanto Health Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #007aff;
            --primary-hover: #0062cc;
            --bg: #f2f2f7;
            --card-bg: #ffffff;
            --text: #000000;
            --text-muted: #8e8e93;
            --border: #c6c6c8;
            --separator: #e5e5ea;
            --danger: #ff3b30;
            --success: #34c759;
            --warning: #ff9500;
            --excel: #34c759;
            --radius: 14px;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px 12px 40px 12px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        header h1 {
            color: var(--text);
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.4px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin: 0;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            padding: 18px;
            margin-bottom: 16px;
            border: 0.5px solid rgba(0,0,0,0.04);
        }

        .card h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 14px;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
        }

        .form-group {
            grid-column: span 1;
        }

        .form-group.full {
            grid-column: span 2;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.95rem;
            background: #fafafa;
            color: var(--text);
            -webkit-appearance: none;
            transition: all 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
        }

        button, .btn-native {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 13px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            width: 100%;
            transition: all 0.15s;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            box-sizing: border-box;
        }

        button:active, .btn-native:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .action-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .action-btn {
            background-color: white;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 11px 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .action-btn.export {
            background-color: #34c759;
            color: white;
            border: none;
        }

        .filter-section {
            background: #f8f8fa;
            border: 1px solid var(--separator);
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-section label {
            font-weight: 600;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .filter-section select {
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.88rem;
            background: white;
            color: var(--text);
            outline: none;
        }

        .segmented-control {
            display: flex;
            background: #e5e5ea;
            padding: 3px;
            border-radius: 10px;
            margin-bottom: 14px;
        }

        .segment-btn {
            background: transparent;
            color: var(--text);
            border: none;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.82rem;
            flex: 1;
            box-shadow: none;
            transition: all 0.2s;
        }

        .segment-btn.active {
            background: white;
            color: var(--text);
            box-shadow: 0 3px 8px rgba(0,0,0,0.08);
        }

        .history-item {
            background: #fafafc;
            border: 1px solid var(--separator);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 700;
            border-bottom: 1px solid var(--separator);
            padding-bottom: 6px;
        }

        .history-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            font-size: 0.85rem;
        }

        .history-metric span {
            color: var(--text-muted);
            font-size: 0.72rem;
            display: block;
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .bg-normal { background-color: var(--success); }
        .bg-warning { background-color: var(--warning); }
        .bg-danger { background-color: var(--danger); }

        .report-box {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .stat-card {
            background: #f8f8fa;
            border: 1px solid var(--separator);
            padding: 12px 14px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-card h3 {
            margin: 0;
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .stat-card p {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
        }

        .delete-btn {
            background: #ffeeee;
            color: var(--danger);
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            width: auto;
            box-shadow: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Denny's Health Tracker</h1>
        <p>Aplikasi Pantau Kesehatan Harian</p>
    </header>

    <!-- Tombol Import & Export -->
    <div class="action-bar">
        <label class="btn-native action-btn" style="cursor: pointer; margin: 0;">
            <span>📥</span> Import Excel
            <input type="file" id="importFile" accept=".csv" style="display: none;" onchange="importFromExcel(event)">
        </label>
        <button class="btn-native action-btn export" onclick="exportToExcel()">
            <span>📊</span> Export Excel
        </button>
    </div>

    <!-- Form Input Harian -->
    <div class="card">
        <h3>Input Data Kesehatan</h3>
        <form id="healthForm">
            <div class="form-grid">
                <div class="form-group full">
                    <label>Tanggal</label>
                    <input type="date" id="dateInput" required>
                </div>
                <div class="form-group">
                    <label>Sys (mmHg)</label>
                    <input type="number" id="sysInput" placeholder="120" required>
                </div>
                <div class="form-group">
                    <label>Dia (mmHg)</label>
                    <input type="number" id="diaInput" placeholder="80" required>
                </div>
                <div class="form-group">
                    <label>Kolesterol Tot</label>
                    <input type="number" id="cholTotal" placeholder="200">
                </div>
                <div class="form-group">
                    <label>Asam Urat</label>
                    <input type="number" step="0.1" id="uricInput" placeholder="5.5">
                </div>
                <div class="form-group">
                    <label>HDL</label>
                    <input type="number" id="cholHdl" placeholder="50">
                </div>
                <div class="form-group">
                    <label>LDL</label>
                    <input type="number" id="cholLdl" placeholder="100">
                </div>
            </div>
            <button type="submit">Simpan Catatan</button>
        </form>
    </div>

    <!-- Bagian Laporan & Riwayat -->
    <div class="card">
        <!-- Filter Bulan -->
        <div class="filter-section">
            <label for="monthFilter">📅 Filter Berdasarkan Bulan</label>
            <select id="monthFilter" onchange="updateUI()">
                <option value="all">Semua Bulan (Keseluruhan)</option>
            </select>
        </div>

        <div class="segmented-control">
            <button class="segment-btn active" onclick="switchTab('weekly', event)">Ringkasan</button>
            <button class="segment-btn" onclick="switchTab('history', event)">Riwayat</button>
            <button class="segment-btn" onclick="switchTab('chart', event)">Grafik</button>
        </div>

        <!-- Tab Ringkasan -->
        <div id="weekly" class="tab-content">
            <h3 style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 12px;" id="summaryTitle">Rata-rata Keseluruhan</h3>
            <div class="report-box" id="summaryStats"></div>
        </div>

        <!-- Tab Riwayat (Card-based untuk layar kecil iPhone) -->
        <div id="history" class="tab-content" style="display:none;">
            <h3 style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 12px;">Daftar Catatan Masuk</h3>
            <div id="historyCardList"></div>
        </div>

        <!-- Tab Grafik -->
        <div id="chart" class="tab-content" style="display:none;">
            <h3 style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 12px;">Grafik Tren Tensi & Asam Urat</h3>
            <div style="position: relative; height:260px; width:100%">
                <canvas id="healthChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('dateInput').valueAsDate = new Date();

    let healthData = JSON.parse(localStorage.getItem('healthData')) || [];
    let myChart = null;

    document.getElementById('healthForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const now = new Date();
        const optionsDay = { weekday: 'long', timeZone: 'Asia/Jakarta' };
        const dayName = new Intl.DateTimeFormat('id-ID', optionsDay).format(now);
        const timeString = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Jakarta' });
        const inputDateVal = document.getElementById('dateInput').value;

        const newData = {
            id: Date.now(),
            date: inputDateVal,
            day: dayName,
            timestamp: `${dayName}, ${inputDateVal} - ${timeString}`,
            sys: Number(document.getElementById('sysInput').value),
            dia: Number(document.getElementById('diaInput').value),
            cholTotal: Number(document.getElementById('cholTotal').value) || 0,
            cholHdl: Number(document.getElementById('cholHdl').value) || 0,
            cholLdl: Number(document.getElementById('cholLdl').value) || 0,
            uric: Number(document.getElementById('uricInput').value) || 0
        };

        healthData.push(newData);
        healthData.sort((a, b) => new Date(b.date) - new Date(a.date));
        localStorage.setItem('healthData', JSON.stringify(healthData));
        
        alert('Data berhasil disimpan!');
        this.reset();
        document.getElementById('dateInput').valueAsDate = new Date();
        updateUI();
    });

    function deleteData(id) {
        if(confirm('Hapus data ini?')) {
            healthData = healthData.filter(item => item.id !== id);
            localStorage.setItem('healthData', JSON.stringify(healthData));
            updateUI();
        }
    }

    function switchTab(tabId, event) {
        document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.segment-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).style.display = 'block';
        event.currentTarget.classList.add('active');

        if(tabId === 'chart') renderChart();
    }

    function exportToExcel() {
        if(healthData.length === 0) {
            alert('Belum ada data!');
            return;
        }

        let csvContent = "\uFEFFWaktu,Tanggal,Hari,Sistolik,Diastolik,Kolesterol Total,HDL,LDL,Asam Urat\n";
        healthData.forEach(item => {
            csvContent += `"${item.timestamp}","${item.date}","${item.day}",${item.sys},${item.dia},${item.cholTotal},${item.cholHdl},${item.cholLdl},${item.uric}\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `health_tracker_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
    }

    function importFromExcel(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const lines = e.target.result.split('\n');
            if (lines.length <= 1) {
                alert('File kosong.');
                return;
            }

            let count = 0;
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const row = [];
                let inQ = false, cur = '';
                for (let char of line) {
                    if (char === '"') inQ = !inQ;
                    else if (char === ',' && !inQ) { row.push(cur); cur = ''; }
                    else cur += char;
                }
                row.push(cur);

                if (row.length >= 9) {
                    healthData.push({
                        id: Date.now() + Math.random(),
                        timestamp: row[0].replace(/"/g, ''),
                        date: row[1].replace(/"/g, ''),
                        day: row[2].replace(/"/g, ''),
                        sys: Number(row[3]) || 0,
                        dia: Number(row[4]) || 0,
                        cholTotal: Number(row[5]) || 0,
                        cholHdl: Number(row[6]) || 0,
                        cholLdl: Number(row[7]) || 0,
                        uric: Number(row[8]) || 0
                    });
                    count++;
                }
            }

            healthData.sort((a, b) => new Date(b.date) - new Date(a.date));
            localStorage.setItem('healthData', JSON.stringify(healthData));
            updateUI();
            alert(`Berhasil mengimport ${count} data!`);
            event.target.value = '';
        };
        reader.readAsText(file);
    }

    function populateMonthDropdown() {
        const monthFilter = document.getElementById('monthFilter');
        const current = monthFilter.value;
        const set = new Set();
        healthData.forEach(item => { if(item.date) set.add(item.date.substring(0, 7)); });
        
        const sorted = Array.from(set).sort().reverse();
        monthFilter.innerHTML = '<option value="all">Semua Bulan (Keseluruhan)</option>';
        
        sorted.forEach(ym => {
            const [y, m] = ym.split('-');
            const name = new Date(y, m - 1, 1).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
            const opt = document.createElement('option');
            opt.value = ym;
            opt.textContent = name;
            monthFilter.appendChild(opt);
        });

        if (Array.from(monthFilter.options).some(o => o.value === current)) monthFilter.value = current;
    }

    function getFilteredData() {
        const val = document.getElementById('monthFilter').value;
        if (val === 'all') return healthData;
        return healthData.filter(i => i.date && i.date.startsWith(val));
    }

    function getStatusBadge(val, type) {
        if (!val && val !== 0) return '';
        if(type === 'sys') {
            if(val < 120) return '<span class="badge bg-normal">Normal</span>';
            if(val < 140) return '<span class="badge bg-warning">Pre-Hipertensi</span>';
            return '<span class="badge bg-danger">Hipertensi</span>';
        }
        if(type === 'uric') {
            if(val <= 6.0) return '<span class="badge bg-normal">Normal</span>';
            return '<span class="badge bg-danger">Tinggi</span>';
        }
        if(type === 'cholTotal') {
            if(val < 200) return '<span class="badge bg-normal">Normal</span>';
            if(val < 240) return '<span class="badge bg-warning">Batas</span>';
            return '<span class="badge bg-danger">Tinggi</span>';
        }
        return '';
    }

    function updateUI() {
        populateMonthDropdown();
        const filtered = getFilteredData();
        
        // Update List Riwayat (Card Layout khusus Mobile)
        const listContainer = document.getElementById('historyCardList');
        listContainer.innerHTML = '';
        
        if(filtered.length === 0) {
            listContainer.innerHTML = `<p style="color:var(--text-muted); text-align:center; padding: 20px; font-size:0.85rem;">Belum ada catatan pada periode ini.</p>`;
        } else {
            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div class="history-header">
                        <span>${item.timestamp}</span>
                        <button onclick="deleteData(${item.id})" class="delete-btn">Hapus</button>
                    </div>
                    <div class="history-body">
                        <div class="history-metric">
                            <span>Tensi Darah</span>
                            <strong>${item.sys} / ${item.dia}</strong> ${getStatusBadge(item.sys, 'sys')}
                        </div>
                        <div class="history-metric">
                            <span>Asam Urat</span>
                            <strong>${item.uric || '-'} mg/dL</strong> ${getStatusBadge(item.uric, 'uric')}
                        </div>
                        <div class="history-metric">
                            <span>Kolesterol Total</span>
                            <strong>${item.cholTotal || '-'} mg/dL</strong> ${getStatusBadge(item.cholTotal, 'cholTotal')}
                        </div>
                        <div class="history-metric">
                            <span>HDL / LDL</span>
                            <strong>${item.cholHdl || '-'}/${item.cholLdl || '-'}</strong>
                        </div>
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        // Update Ringkasan Stat
        const summaryBox = document.getElementById('summaryStats');
        const selectedOptionText = document.getElementById('monthFilter').selectedOptions[0].text;
        document.getElementById('summaryTitle').textContent = `Rata-rata: ${selectedOptionText}`;

        if(filtered.length === 0) {
            summaryBox.innerHTML = `<p style="color:var(--text-muted); font-size:0.85rem; text-align:center;">Data tidak cukup untuk dihitung.</p>`;
        } else {
            const avgSys = Math.round(filtered.reduce((a, c) => a + c.sys, 0) / filtered.length);
            const avgDia = Math.round(filtered.reduce((a, c) => a + c.dia, 0) / filtered.length);
            const avgChol = Math.round(filtered.reduce((a, c) => a + (c.cholTotal || 0), 0) / filtered.length);
            const avgUric = (filtered.reduce((a, c) => a + (c.uric || 0), 0) / filtered.length).toFixed(1);

            summaryBox.innerHTML = `
                <div class="stat-card">
                    <h3>Rata-rata Tensi</h3>
                    <p>${avgSys} / ${avgDia} <span style="font-size:0.75rem; color:var(--text-muted);">mmHg</span></p>
                </div>
                <div class="stat-card">
                    <h3>Kolesterol Total</h3>
                    <p>${avgChol} <span style="font-size:0.75rem; color:var(--text-muted);">mg/dL</span></p>
                </div>
                <div class="stat-card">
                    <h3>Asam Urat</h3>
                    <p>${avgUric} <span style="font-size:0.75rem; color:var(--text-muted);">mg/dL</span></p>
                </div>
            `;
        }

        if(document.getElementById('chart').style.display === 'block') {
            renderChart();
        }
    }

    function renderChart() {
        const ctx = document.getElementById('healthChart').getContext('2d');
        const sorted = [...getFilteredData()].sort((a, b) => new Date(a.date) - new Date(b.date));
        
        if(myChart) myChart.destroy();

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: sorted.map(i => i.date),
                datasets: [
                    {
                        label: 'Sistolik',
                        data: sorted.map(i => i.sys),
                        borderColor: '#ff3b30',
                        backgroundColor: 'rgba(255, 59, 48, 0.05)',
                        borderWidth: 2.5,
                        tension: 0.3,
                        fill: true
                    },
                    {
                        label: 'Asam Urat',
                        data: sorted.map(i => i.uric),
                        borderColor: '#007aff',
                        backgroundColor: 'rgba(0, 122, 255, 0.05)',
                        borderWidth: 2.5,
                        tension: 0.3,
                        fill: true
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, grid: { color: '#f1f1f5' } },
                    x: { grid: { display: false } }
                },
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { font: { family: 'Plus Jakarta Sans', size: 11, weight: 600 } }
                    }
                }
            }
        });
    }

    updateUI();
</script>

</body>
</html>
